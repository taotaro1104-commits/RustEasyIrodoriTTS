[workspace]
resolver = "2"
members = ["crates/irodori-core", "crates/irodori-cli"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
safetensors = "0.8.0"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
regex = "1"
unicode-normalization = "0.1"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "flac", "ogg", "vorbis", "aac", "isomp4", "alac"] }
rubato = "0.16"
hound = "3"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
