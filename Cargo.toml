[workspace]
resolver = "2"
members = ["crates/irodori-core", "crates/irodori-cli", "crates/irodori-store", "crates/irodori-app"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
safetensors = "0.8.0"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
regex = "1"
unicode-normalization = "0.1"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "flac", "ogg", "vorbis", "aac", "isomp4", "alac"] }
hound = "3"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
unicode-segmentation = "1"
ryu = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs"] }
tower = { version = "0.5", features = ["util"] }
rust-embed = "8"
pulldown-cmark = "0.13"
subtle = "2"
